# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/tire_request_db

# Email Configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false # Set to true for debugging email issues

# Server Port
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB # Max total size for a multipart request
file.upload-dir=./uploads

# Application URLs
app.base-url=http://localhost:8080
frontend.base-url=http://localhost:3000

# JWT Configuration
app.jwtSecret=YourSuperSecretKeyForTireRequestSystemAppJWTsShouldBeVeryLongAndRandom
app.jwtExpirationMs=86400000
